<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Ayat Saber Mohamed - Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="0.55" stop-color="#24283b"/>
      <stop offset="1" stop-color="#3d59a1"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="220" fill="url(#bg)"/>

  <!-- back wave -->
  <path d="M0,150 Q250,110 500,150 T1000,150 T1500,150 T2000,150 V220 H0 Z" fill="#7aa2f7" fill-opacity="0.18">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="14s" repeatCount="indefinite"/>
  </path>
  <!-- front wave -->
  <path d="M0,175 Q250,140 500,175 T1000,175 T1500,175 T2000,175 V220 H0 Z" fill="#7aa2f7" fill-opacity="0.32">
    <animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="9s" repeatCount="indefinite"/>
  </path>

  <text x="500" y="88" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff" opacity="0">
    Ayat Saber Mohamed
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
  </text>
  <text x="500" y="128" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" letter-spacing="3" fill="#c0caf5" opacity="0">
    SOFTWARE ENGINEER  |  WEB &amp; MOBILE
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" begin="0.8s" fill="freeze"/>
  </text>
</svg>
